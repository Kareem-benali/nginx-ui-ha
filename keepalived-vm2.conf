# =============================================================================
# keepalived.conf — VM2 (STANDBY)
# Production HA pair for nginx-ui + nginx.  Tested design, keepalived 2.3.3.
#
# STICKY FAILOVER MODEL (what this config does):
#   * While VM1 is healthy: this node is BACKUP and serves nothing on the VIP.
#   * If VM1 fails: this node becomes MASTER within ~4s and keeps the VIP.
#   * When VM1 recovers it is GATED by its own chk_sync gate (effective
#     priority 60 < our 100), so it CANNOT take the VIP back from us — we
#     remain master.  <- "VIP stays on the promoted node"
#   * While we are master we keep pulling nothing; instead VM1 (standby)
#     restores a full backup from US (ha-sync.sh).  Role + sync direction
#     flip automatically.
#   * Failback to VM1 is a manual operator action (ha-failback.sh on VM1);
#     when it happens we demote to BACKUP and resync from VM1 automatically.
#
# NOTE: intentionally NO `nopreempt` here. If a solo node ever holds the VIP
# while gated (e.g. it rebooted alone and is serving with older data), we
# must be able to take over with the fresher data when we come up. nopreempt
# (verified in testing) would block that and leave the stale node in charge.
# =============================================================================

global_defs {
    # keepalived 2.3.x: required to run vrrp/notify scripts.
    enable_script_security

    # Our scripts need root (nginx -t, writing /run/ha, restore flow).
    script_user root
}

# --- service health checks (drop priority when a service is broken) ---------
vrrp_script chk_nginx {
    script "/usr/local/bin/chk_nginx.sh"
    interval 2
    weight -30
    fall 3
    rise 2
}

vrrp_script chk_nginxui {
    script "/usr/local/bin/chk_nginxui.sh"
    interval 2
    weight -20
    fall 3
    rise 2
}

vrrp_script chk_conf {
    script "/usr/local/bin/chk_conf.sh"
    interval 10
    weight -50
    fall 2
    rise 2
}

vrrp_instance VI_NGINX {
    state BACKUP                  # VM2 = standby (priority 100)
    interface <NIC_NAME>                # <-- your real interface (e.g. eth0, ens18, ens224)
    virtual_router_id 51
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_AUTH_PASS        # must match on both nodes, max 8 chars
    }
    track_script {
        chk_nginx
        chk_nginxui
        chk_conf
    }
    # (the VRRP interface itself is monitored automatically by keepalived;
    #  NIC down -> FAULT -> VIP released. track_interface is only useful
    #  for a *different* interface, e.g. a management NIC.)
    notify_master "/usr/local/bin/ha-notify.sh master"
    notify_backup "/usr/local/bin/ha-notify.sh backup"
    notify_fault  "/usr/local/bin/ha-notify.sh fault"
    virtual_ipaddress {
        <VIP_ADDRESS>/24          # <-- your VIP
    }
}