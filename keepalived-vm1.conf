# =============================================================================
# keepalived.conf — VM1 (PREFERRED PRIMARY)
# Production HA pair for nginx-ui + nginx.  Tested design, keepalived 2.3.3.
#
# STICKY FAILOVER MODEL (what this config does):
#   * While healthy: this node is MASTER and serves the VIP.
#   * If this node fails: VM2 (BACKUP/100) takes the VIP within ~4s.
#   * When THIS node comes back, it starts GATED: chk_sync fails (its
#     /run/ha/i-am-master marker was wiped by the reboot), so its effective
#     priority is 110-50=60 — BELOW VM2's 100. It therefore CANNOT steal the
#     VIP back and becomes the standby.  <- "VIP stays on the promoted node"
#   * As standby it automatically restores a full backup from the current
#     master (ha-sync.sh, triggered by ha-notify.sh + hourly cron).
#   * Failback is a manual operator action: `ha-failback.sh` (verifies the
#     restore is fresh) -> this node preempts the VIP and becomes master
#     again; VM2 becomes standby and resyncs from it.  Direction of backup/
#     restore flips automatically with the role.
#
# NOTE: do NOT add `nopreempt` here — with initial `state MASTER`, 2.3.3
# clears the flag anyway; stickiness comes from the chk_sync gate instead.
# =============================================================================

global_defs {
    # keepalived 2.3.x: required to run vrrp/notify scripts (and to enforce
    # the script security checks). Without it you get "SECURITY VIOLATION".
    enable_script_security

    # Our scripts need root (nginx -t, writing /run/ha, restore flow).
    # 2.3.3 otherwise runs scripts as user "keepalived_script" when that
    # user exists. See README-runbook.md for the unprivileged alternative.
    script_user root
}

# --- VIP eligibility gate (THE sticky-failover mechanism) -------------------
# PASS(0): /run/ha/i-am-master   -> this keepalived session is/has been MASTER
#         (local data is the source of truth). tmpfs: wiped on VM reboot.
# PASS(0): /run/ha/failback-allowed -> operator authorized manual failback
#         (written by ha-failback.sh after verifying a fresh restore).
# FAIL(1): otherwise -> node is recovering and NOT in sync -> may not hold
#         the VIP (effective priority drops 110 -> 60, below VM2's 100).
vrrp_script chk_sync {
    script "/usr/local/bin/chk_sync.sh"
    interval 2
    weight -50
    fall 1
    rise 1
}

# --- service health checks (drop priority when a service is broken) ---------
vrrp_script chk_nginx {
    script "/usr/local/bin/chk_nginx.sh"
    interval 2
    weight -30
    fall 3
    rise 2
}

vrrp_script chk_nginxui {
    script "/usr/local/bin/chk_nginxui.sh"
    interval 2
    weight -20
    fall 3
    rise 2
}

vrrp_script chk_conf {
    script "/usr/local/bin/chk_conf.sh"
    interval 10
    weight -50
    fall 2
    rise 2
}

vrrp_instance VI_NGINX {
    state MASTER                  # VM1 = preferred primary (priority 110)
    interface <NIC_NAME>                # <-- your real interface (e.g. eth0, ens18, ens224)
    virtual_router_id 51
    priority 110
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_AUTH_PASS        # must match on both nodes, max 8 chars
    }
    track_script {
        chk_sync                  # eligibility gate (sticky failover)
        chk_nginx
        chk_nginxui
        chk_conf
    }
    # (the VRRP interface itself is monitored automatically by keepalived;
    #  NIC down -> FAULT -> VIP released. track_interface is only useful
    #  for a *different* interface, e.g. a management NIC.)
    notify_master "/usr/local/bin/ha-notify.sh master"
    notify_backup "/usr/local/bin/ha-notify.sh backup"
    notify_fault  "/usr/local/bin/ha-notify.sh fault"
    virtual_ipaddress {
        <VIP_ADDRESS>/24          # <-- your VIP
    }
}